[mic]
; Turns the mic off/on while playing. Same format as vr.ini [keys]: e.g. Ctrl+M, Shift+F9, Alt+Home, or none.
toggle_key=Ctrl+M
; 1 = mic on at launch, 0 = off (keyboard can play instruments until toggled on).
start_on=1
; 1 = Windows beep on toggle (normal beep = on, error beep = off), 0 = silent.
toggle_sound=1
