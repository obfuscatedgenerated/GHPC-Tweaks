# Builds the tweaks on every push and pull request, and publishes a release
# when a version tag (e.g. v1.0) is pushed:
#   git tag v1.0 && git push origin v1.0
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install 32-bit MinGW
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686

      - name: Build Rock Band guitar fix
        run: sh ./gh3-rb-fix/build.sh

      - name: Assemble release bundle
        run: |
          version="${GITHUB_REF_NAME//\//-}"
          bundle="guitar-hero-pc-tweaks-${version}"
          echo "BUNDLE=${bundle}" >> "$GITHUB_ENV"

          mkdir -p "${bundle}/gh3-rb-fix" "${bundle}/dxwnd"
          cp gh3-rb-fix/dist/xinput1_3.dll \
             gh3-rb-fix/dist/xinput1_2.dll \
             gh3-rb-fix/dist/xinput1_1.dll \
             gh3-rb-fix/README.md \
             "${bundle}/gh3-rb-fix/"
          cp dxwnd/*.dxw dxwnd/README.md "${bundle}/dxwnd/"
          cp README.md "${bundle}/"

          (cd "${bundle}" && zip -r "../${bundle}.zip" .)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE }}
          path: ${{ env.BUNDLE }}/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${BUNDLE}.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
